<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- 
xmlns:th="http://www.thymeleaf.org"
* Activa el “espacio de nombres” de Thymeleaf.
* Permite usar atributos especiales como th:href, th:src, th:text, th:each, etc.
* Sin esto, Thymeleaf no reconoce sus propias funciones.
-->

<!-- plantilla para maquetar la página de inicio del usuario, con el listado de activos digitales -->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="Miriam Mendieta" name="author">
  <title>ZeertyDigital - Home</title>

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/img/favicon_io/apple-touch-icon.png}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon_io/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/favicon_io/favicon-16x16.png}">
  <link rel="manifest" th:href="@{/img/favicon_io/site.webmanifest}">

  <!-- CSS -->
  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/home.css}">
</head>

<body>

  <!-- HEADER -->
  <th:block th:replace="~{fragments/header_user :: header_user}"></th:block>


  <!-- CONTENIDO PRINCIPAL -->
  <div class="zd-container">
    <div th:if="${usuario != null and usuario.rol.name() == 'ADMINISTRACION'}" class="panel-actions">
      <a class="btn-admin" th:href="@{/admin/home}">
        ← Volver a Administración
      </a>
    </div>

    <div class="panel-list">
      <div class="panel-header">
        <h1>Activos Digitales</h1>

        <a class="btn-crear" th:href="@{/activos/crear}">+ Añadir Activo</a>

        <table class="tabla-activos">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Descripción</th>
              <th>Fecha de alta</th>
              <th>Fecha de caducidad</th>
              <th>Acciones</th>
            </tr>
          </thead>

          <tbody>
            <tr th:each="activo : ${listaActivos}">
              <td th:text="${activo.nombre}"></td>
              <td th:text="${activo.categoria}"></td>
              <td th:text="${activo.descripcion}"></td>
              <td th:text="${activo.fecha_alta}"></td>
              <td th:text="${activo.fecha_caducidad}"></td>

              <td class="acciones">
                <a class="btn-ver" th:href="@{'/activos/ver/' + ${activo.id_activo}}">Ver</a>
                <a class="btn-editar" th:href="@{'/activos/editar/' + ${activo.id_activo}}">Editar</a>
                <a class="btn-eliminar" th:href="@{'/activos/eliminar/' + ${activo.id_activo}}"
                  onclick="return confirm('¿Seguro que deseas eliminar este activo?');">
                  Eliminar
                </a>
              </td>
            </tr>

           <tr th:if="${#lists.isEmpty(listaActivos)}">
              <td colspan="6" class="sin-activos">No tienes activos registrados.</td>
            </tr>
          </tbody>
        </table>

      </div> <!-- panel-header -->
    </div> <!-- panel-list -->
  </div> <!-- zd-container -->


  <!-- FOOTER -->
  <th:block th:replace="~{fragments/footer :: footer}"></th:block>

</body>

</html>
