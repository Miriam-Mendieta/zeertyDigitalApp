<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Ver Activo Digital</title>
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/img/favicon_io/apple-touch-icon.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon_io/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/favicon_io/favicon-16x16.png}">
    <link rel="manifest" th:href="@{/img/favicon_io/site.webmanifest}">

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/ver-activo.css}">
</head>

<body>

    <th:block th:replace="~{fragments/header_user :: header_user}"></th:block>

    <div class="zd-container">

        <div class="card-detalle">
            <h2 class="titulo-detalle">Detalle del Activo</h2>

            <div class="detalle-item">
                <span class="label">Nombre:</span>
                <span class="valor" th:text="${activo.nombre}"></span>
            </div>

            <div class="detalle-item">
                <span class="label">Categoría:</span>
                <span class="valor" th:text="${activo.categoria}"></span>
            </div>

            <div class="detalle-item">
                <span class="label">Descripción:</span>
                <span class="valor" th:text="${activo.descripcion}"></span>
            </div>

            <div class="detalle-item">
                <span class="label">Fecha de alta:</span>
                <span class="valor" th:text="${activo.fecha_alta}"></span>
            </div>

            <div class="detalle-item">
                <span class="label">Fecha de caducidad:</span>
                <span class="valor" th:text="${activo.fecha_caducidad}"></span>
            </div>

            <div class="detalle-item">
                <span class="label">Estado:</span>
                <span class="valor" th:text="${activo.estado}"></span>
            </div>


            <div class="acciones-detalle">
                <a class="btn-volver" th:href="@{/activos/home}">← Volver</a>
            </div>
        </div>

    </div>

    <th:block th:replace="~{fragments/footer :: footer}"></th:block>

</body>

</html>
