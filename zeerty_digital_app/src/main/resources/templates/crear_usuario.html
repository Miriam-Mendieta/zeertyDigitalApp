<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta content="Miriam Mendieta" name="author">
    <title>ZeertyDigital – Alta de Usuario</title>

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/img/favicon_io/apple-touch-icon.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon_io/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/favicon_io/favicon-16x16.png}">
    <link rel="manifest" th:href="@{/img/favicon_io/site.webmanifest}">

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/form_usuario.css}">
</head>

<body>
    <header class="zd-header-create">
        <h1>Dar de alta usuario</h1>
        <nav>
            <a href="/admin/home" class="zd-link">Volver</a>
            <a href="/logout" class="zd-link logout">Salir</a>
        </nav>
    </header>

    <form action="/admin/crear" method="post" th:object="${usuario}" class="zd-form">
        <div class="zd-center">
            <div class="zd-card">
                <th:block th:replace="fragments/form_usuario :: formUsuario"></th:block>

                <div class="zd-btn-area">
                    <button class="zd-btn-create" type="submit">Crear usuario</button>
                </div>
            </div>
        </div>
    </form>
    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
