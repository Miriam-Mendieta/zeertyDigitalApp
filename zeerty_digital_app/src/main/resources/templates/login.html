<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="Miriam Mendieta" name="author">
  <title>ZeertyDigital – Inicio de sesión</title>

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/img/favicon_io/apple-touch-icon.png}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon_io/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/favicon_io/favicon-16x16.png}">
  <link rel="manifest" th:href="@{/img/favicon_io/site.webmanifest}">

  <link rel="stylesheet" th:href="@{/css/global.css}">
  <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>
  <div class="zd-center">
    <div class="login-container">

      <div class="header">
        <img th:src="@{/img/logoZeerty.png}" class="logo" alt="ZeertyDigital">
        <p class="tagline">Tecnología que acompaña... Simplifica, protege y avanza</p>
      </div>

      <form class="login-form" th:action="@{/procesar-login}" method="post">
        <label for="email">Correo electrónico</label>
        <input id="email" name="username" type="email" placeholder="micorreo@gmail.com" required>

        <label for="pass">Contraseña</label>
        <input id="pass" name="password" type="password" placeholder="••••••••" required>

        <button type="submit" class="login-btn">INICIAR SESIÓN</button>
        <div th:if="${param.error}"
          style="color: #dc2626 !important; text-align: center !important; font-size: 0.9rem !important; margin-bottom: 1rem !important; font-weight: 600 !important; display: block !important; width: 100% !important;">
          Correo o contraseña incorrectos.
        </div>
        <div class="extra">
          <p class="no-cuenta">¿No tienes cuenta aún?</p>
          <p class="admin-acceso">
            Solicita el acceso al Administrador para crear tu usuario.
          </p>

        </div>
      </form>

    </div>
  </div>

</body>

</html>
